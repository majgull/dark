# host.toml — deployment facts for the runner host (git-host). Not budgets,
# not the catalog: where things are. Every value can be overridden by the
# environment variable named in the comment.

[host]
org = "dark"                                        # DARK_ORG         (code repos: runner, bench, templates)
work_org = "dark-runs"                              # DARK_WORK_ORG    (task work repos t-*, tl-*, session-*; a fresh experiment gets its own)
records_org = "dark-records"                        # DARK_RECORDS_ORG (session-arm and review-mode transcripts, one repo per shift)
gitea_url = "http://localhost:3400"                 # DARK_GITEA_URL   (the runner's own calls)
gitea_lan_url = "http://git-host:3400"         # DARK_GITEA_LAN   (what VMs reach)
admin_token_file = "~/.factory/factory-admin.token" # DARK_ADMIN_TOKEN_FILE
agent_token_file = "~/.factory/factory-agent.token" # DARK_AGENT_TOKEN_FILE
proxmox = "cpu-host"                      # DARK_PROXMOX
ntfy_url = "http://localhost:8083/factory"          # DARK_NTFY        ("" = no push)
state_dir = "~/.dark"                               # DARK_STATE       (ledger, abort markers, scratch)
templates_dir = "~/dark-templates"                  # DARK_TEMPLATES   (a checkout of dark/templates)
bench_dir = "~/dark-bench"                          # DARK_BENCH       (a checkout of dark/bench)
wake_timeout = 420
# energy sensors (dark/power.py): the RAPL package counter lives on the Proxmox
# host; the GPUs are passed through to the model VM, so nvidia-smi runs there
power_cpu_host = "cpu-host"               # DARK_POWER_CPU   ("" = no CPU metering)
power_gpu_host = "gpu-host"                # DARK_POWER_GPU   ("" = no GPU metering)                                  # seconds a real wake request may take (cold cpu-host + model load)
