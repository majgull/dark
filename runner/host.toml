# host.toml - deployment facts for the runner host. Not budgets, not the
# catalog: where things are. Every value can be overridden by the environment
# variable named in the comment. The values below are examples for a single
# local machine; replace them with your own.

[host]
org = "dark"                                        # DARK_ORG         (code repos: runner, bench, templates)
work_org = "dark-runs"                              # DARK_WORK_ORG    (task work repos t-*, tl-*, session-*; a fresh experiment gets its own)
records_org = "dark-records"                        # DARK_RECORDS_ORG (session-arm and review-mode transcripts, one repo per shift)
gitea_url = "http://localhost:3400"                 # DARK_GITEA_URL   (the runner's own calls)
gitea_lan_url = "http://localhost:3400"             # DARK_GITEA_LAN   (what VMs reach; example value)
git_lan_url = ""                                    # DARK_GIT_LAN     (where VMs clone/push from; "" = gitea_lan_url)
admin_token_file = "~/.dark/dark-admin.token"       # DARK_ADMIN_TOKEN_FILE
agent_token_file = "~/.dark/dark-agent.token"       # DARK_AGENT_TOKEN_FILE
agent_user = "dark-agent"                           # DARK_AGENT_USER  (the Gitea user executor VMs push as)
backend = "proxmox"                                 # DARK_BACKEND     (the compute plane; "proxmox", "docker" or "lxc")
proxmox = "cpu-host"                                # DARK_PROXMOX     (example role name for the Proxmox host)
sandbox_image = "dark-sandbox"                      # DARK_SANDBOX_IMAGE   (docker backend: the image a sandbox is created from; build it with `docker build -t dark-sandbox runner/sandbox`)
sandbox_network = "dark"                            # DARK_SANDBOX_NETWORK (docker backend: the network a sandbox joins; compose.yaml names it <project>_back and sets this env var itself)
sandbox_cpus = "2"                                  # DARK_SANDBOX_CPUS    (docker backend: --cpus; "" = no limit)
sandbox_memory = "2g"                               # DARK_SANDBOX_MEMORY  (docker backend: --memory; "" = no limit)
sandbox_pids = 512                                  # DARK_SANDBOX_PIDS    (docker backend: --pids-limit; 0 = no limit)
sandbox_container = ""                              # DARK_SANDBOX_CONTAINER (lxc backend: the id of the container a sandbox is a full clone of, e.g. "200")
sandbox_snapshot = ""                               # DARK_SANDBOX_SNAPSHOT  (lxc backend: the snapshot of that container to clone from, e.g. "base")
sandbox_bridge = "vmbr0"                            # DARK_SANDBOX_BRIDGE    (lxc backend: the bridge the clone's net0 joins; one that reaches only the service host)
sandbox_pool = ""                                   # DARK_SANDBOX_POOL      (lxc backend: the Proxmox pool a clone is placed in; "" = no pool)
sandbox_allow_in = ""                               # DARK_SANDBOX_ALLOW_IN  (lxc backend: "<ipv4>:<port>" clients a clone's firewall lets in, comma separated; "" = the service host only)
browser_image = "dark-sandbox-browser"              # DARK_BROWSER_IMAGE   (docker backend: the image a user-arm sandbox is created from; build it with runner/sandbox/Dockerfile.browser)
target_network = ""                                 # DARK_TARGET_NETWORK  (docker backend: a second, non-internal network a user-arm sandbox joins to reach the application; "" = none)
target_host = ""                                    # DARK_TARGET_HOST     (Proxmox backend: the one address a user-arm VM's firewall lets out to, e.g. "192.0.2.20"; "" = none)
ntfy_url = ""                                       # DARK_NTFY        (optional; "" = no push)
otlp_endpoint = ""                                  # DARK_OTLP_ENDPOINT (optional; an OTLP/HTTP collector: set DARK_OTLP_UPSTREAM on the compose otlp-gate service to the collector and the value here to "http://otlp-gate:4318", or on a bare host such as "http://localhost:4318"; every finished run is posted to <it>/v1/traces as spans; "" = nothing sent)
state_dir = "~/.dark"                               # DARK_STATE       (ledger, abort markers, scratch)
templates_dir = "~/dark-templates"                  # DARK_TEMPLATES   (a checkout of dark/templates)
bench_dir = "~/dark-bench"                          # DARK_BENCH       (a checkout of dark/bench)
task_dirs = ""                                      # DARK_TASKS       (task-set roots, ":" separated; "" = bench_dir above)
wake_timeout = 420                                  # DARK_WAKE_TIMEOUT (seconds a real wake request may take)
# energy sensors (dark/power.py): the RAPL package counter lives on the Proxmox
# host; the GPUs are passed through to the model VM, so nvidia-smi runs there
power_cpu_host = "cpu-host"                         # DARK_POWER_CPU   (example role name; "" = no CPU metering)
power_gpu_host = "gpu-host"                         # DARK_POWER_GPU   (example role name; "" = no GPU metering)
