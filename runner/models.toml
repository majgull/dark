# models.toml — the catalog as data (design §3). Human-written fields only.
# Measured numbers live in the ledger and the digest renders them; nobody
# edits this file to record a measurement (one writer per file).
#
# provider  which endpoint serves the id (see [provider.*] below)
# cost      "local": charged in watts, never in a window
#           "sub-window": subscription, capped by the provider's daily window
#           in budgets.toml — the window is the scarce thing, not money
# speed     fast | mid | slow   sub-window tiers rank by this in cost_order
# watts     low | mid | high    local tiers rank by this; required when local
# role      optional list. "validator": the default tier for validation, smoke
#           and re-check calls; never a data-producing executor unless it is
#           the admitted tier for the class. "planner", "planner-light",
#           "reviewer": control-plane classes.
# ctx       context the tier is trusted with (prompt budget), optional
# timeout   seconds per chat call inside the VM (default from [defaults])
# rate_limit_signature  substring marking the window as exhausted -> cooldown
#
# Every id here is validated against its provider's live catalog at preflight;
# an id that is not served refuses the shift (the v1 `-coding` rename lesson).

[defaults]
timeout = 600
max_tokens = 8192
temperature = 0.2

# think_presets  per model: the router preset to request at a level (VM 101
#   llama-router.ini, --reasoning-budget = level chars / 4.5, added 2026-09-02:
#   measured 4.07 chars per reasoning token on the 35B, so a budget of chars / 3
#   sat above dark's cut and the cut fired first on every long-thinking call);
#   the model ends its own thinking in one request, dark's cut stays the bound.
# think_api  how dark's thinking level reaches the provider (budgets [think]):
#           reasoning_effort (OpenAI-style field, ollama honours it: probed
#           2026-09-02), chat_template (llama.cpp enable_thinking on/off, no
#           level), none (claude-cli proxy: nothing reaches the model)
# stream    SSE replies; the live thinking cut needs it (default: wake)

[provider.gate]
url = "http://git-host:4100/v1"
catalog = "models"          # GET <url>/models lists served ids (answers while asleep)
wake = true                 # a real chat request WOL-wakes the llm server
window = ""                 # local: no window
think_api = "chat_template"
stream = true

[provider.ollama-cloud]
url = "http://git-host:11434/v1"
catalog = "models"
window = "ollama-cloud"
think_api = "reasoning_effort"
stream = true

[provider.claude]
url = "http://git-host:4300/v1"
health = "http://git-host:4300/healthz"   # lists models, reports token presence
window = "claude"
# the proxy runs `claude -p` (Claude Code CLI, print mode) and returns text
# with zero usage: thinking is the CLI's own, tokens NOT MEASURED, no stream
think_api = "none"
stream = false

# thinking_tokens  budget for thinking on top of max_tokens (the response
#           budget). Every provider counts thinking inside max_tokens, so the
#           request carries the sum; a tier without it does not think (or is
#           not expected to). 16384 tokens is about the 60000-char class cap.
# think     off | on | low | medium | high, passed to the provider; unset =
#           the provider's default. Verified per provider by probe first.

# ---- local tiers (operator, 2026-09-02): 35B cheap and fast, dsf-like; 27B solid
# but slow, more watts; 9B in the middle. Encoded once, here. ----------------

