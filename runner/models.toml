# models.toml - the model catalog as data. Human-written fields only; measured
# numbers live in the ledger and the digest renders them.
#
# This file is a working example. It names one OpenAI-compatible endpoint and
# two placeholder model ids. Point `url` at your own endpoint and replace the
# ids with ones it serves.
#
# provider  which endpoint serves the id (see [provider.*] below)
# cost      "local": charged in watts, never in a window
#           "sub-window": subscription, capped by the provider's daily window
#           in budgets.toml; the window is the scarce thing, not money
# speed     fast | mid | slow   sub-window tiers rank by this in cost_order
# watts     low | mid | high    local tiers rank by this; required when local
# role      optional list. "validator": the default tier for validation, smoke
#           and re-check calls. "planner", "planner-light", "reviewer":
#           control-plane classes.
# ctx       context the tier is trusted with (prompt budget), optional
# timeout   seconds per chat call inside the VM (default from [defaults])
# rate_limit_signature  substring marking the window as exhausted -> cooldown
#
# Every id here is validated against its provider's live catalog at preflight;
# an id that is not served refuses the shift.

[defaults]
timeout = 600
max_tokens = 8192
temperature = 0.2

# think_api  how dark's thinking level reaches the provider:
#            reasoning_effort (OpenAI-style field), chat_template (llama.cpp
#            enable_thinking on/off, no level), none (nothing reaches the model)
# stream     SSE replies; the live thinking cut needs it (default: wake)

[provider.local]
url = "http://localhost:11434/v1"   # an OpenAI-compatible endpoint (ollama's default)
catalog = "models"                  # GET <url>/models lists served ids (answers while asleep)
window = ""                         # local: no window
think_api = "chat_template"
stream = true

# ---- placeholder tiers: replace each id with one your endpoint serves -------

[model."example-small"]
provider = "local"
cost = "local"
speed = "fast"
watts = "low"
role = ["validator"]
ctx = 32768
timeout = 600
note = "placeholder; replace with an id your endpoint serves"

[model."example-large"]
provider = "local"
cost = "local"
speed = "slow"
watts = "high"
ctx = 32768
timeout = 900
note = "placeholder; replace with an id your endpoint serves"
