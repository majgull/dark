# budgets.toml - every bound the runner enforces, as data.
#
# Hard caps are the one thing a human writes. Soft limits are derived from the
# ledger: p95 of the class's passes times (1 + headroom), clipped by hard, once
# the class has [admission].min_runs passes; hard before that. Hard caps are
# placeholders: they get corrected from the ledger's measured consumption, never
# from guesses. The runner refuses to start if any class in spec.CLASSES has no
# hard cap.

[watts]
# The watts cap stays effectively open while a deployment is being measured:
# hangs are already bounded by the per-call timeout, the class seconds envelope
# and the watchdog, and a whole day of the high class is a few kWh. Raise it
# from what the rounds measure once the deployment is stable. The ledger keeps
# charging Wh either way.
daily_wh = 1000000000
# draw per watts class, W: PLACEHOLDERS, used only for run.end rows that carry
# no measured `wh`. A run with a meter is metered (RAPL package + nvidia-smi);
# no report may present these placeholders as watts.
low = 180
mid = 250
high = 380

# ---- per class: hard envelope, headroom for the soft limit, admission
# threshold, and the provisional tier order used until a (class, tier) pair
# has min_runs of data. Order = cheapest-first by the tiers' own profiles. ------

# think: the level the class runs at when a shift sets none; admission and the
# soft envelope count only runs at that level. max_reasoning_chars is per call
# and is the bound above the level's cut: 40000 sits over medium's 32000 with
# margin and under high.

[class.additive]
# passes at low, local: calls p95 3 (max 5), seconds p95 229 (max 289; every
# valid run under 664); cloud at medium: seconds max 455. 6 calls is where
# the local fails land, so it stays the cap and the soft rule sizes below it.
think = "low"
hard = { runs = 2, calls = 6, seconds = 900, max_reasoning_chars = 40000 }
headroom = 0.3
admit_at = 0.7
# A local thinking tier needs up to 6 calls on this class, so 6 is the cap the
# soft rule sizes below.
provisional = ["example-small", "example-large"]

[class.mechanical]
# one call per pass on every tier at every level (max 2); seconds max 49 at
# none, 153 at low; reasoning at none is 0, at low p95 7495 per call, and the
# 10000 rules out the long uncontrolled runs.
think = "none"
hard = { runs = 2, calls = 4, seconds = 300, max_reasoning_chars = 10000 }
headroom = 0.3
admit_at = 0.7
# Thinking buys nothing on this class, so the cheapest admitted tier is picked.
provisional = ["example-small", "example-large"]

[class.repair]
# passes at low: calls p95 3 (max 8), seconds p95 183 (max 304); the only run
# past 900 s never finished. 900 is three times the slowest pass.
think = "low"
hard = { runs = 2, calls = 8, seconds = 900, max_reasoning_chars = 40000 }
headroom = 0.5
admit_at = 0.5
# Local tiers pass this class at low with a wide spread; keep the cap generous.
provisional = ["example-small", "example-large"]

# spec and review are not benched: high is their level, the caps stay
# placeholders. A provider that ignores the level (think_api none) documents
# the intent until a controllable tier serves them.
[class.spec]
think = "high"
hard = { runs = 1, calls = 3, seconds = 600, max_reasoning_chars = 80000 }
headroom = 0.2
admit_at = 0.7
provisional = ["example-large"]

[class.review]
think = "high"
hard = { runs = 1, calls = 4, seconds = 1800, max_reasoning_chars = 120000 }
headroom = 0.2
admit_at = 0.7
provisional = ["example-large"]

# long: one session for hours over several repositories, judged by a reviewer
# session. The calls ceiling is set never to bind (the seconds do); no
# admission, the operator names the tier. Not benched: the caps are placeholders.
[class.long]
think = "medium"
hard = { runs = 1, calls = 2000, seconds = 14400, max_reasoning_chars = 40000 }
headroom = 0.2
admit_at = 0
provisional = ["example-large"]

# the user arm (dark/user.py): one browser action per call, a few per step.
# Not benched: the caps are placeholders until the ledger sizes them.
[class.user]
think = "low"
hard = { runs = 1, calls = 40, seconds = 1200, max_reasoning_chars = 40000 }
headroom = 0.3
admit_at = 0.7
provisional = ["example-large"]

[admission]
min_runs = 10      # below this a (class, tier) pair is admitted only provisionally
last_runs = 20     # the pass rate is over the last N runs of the pair
# cheapest first; a tier's rank is "<cost>/<watts>" when local, "<cost>/<speed>"
# when sub-window. Both watts and window are costs.
cost_order = ["local/low", "local/high"]

[think]
# dark's own thinking levels: characters of visible thinking per call, cut live
# from the stream by the executor, the same for every tier. Characters because they
# are the one unit every provider exposes as it happens; tokens differ per
# tokenizer and arrive only in the final usage. The provider is told the
# nearest thing it understands (reasoning_effort, enable_thinking) so the
# model is aware, but the bound is ours. A run's cumulative budget is the
# level times the envelope's calls. The response keeps [defaults].max_tokens
# for itself; the request ceiling is response + level / chars_per_token.
# Claude via the claude-cli proxy is uncontrolled (nothing reaches the model
# and the reply is not a stream); its runs carry think_api = none.
none = 0
low = 8000
medium = 32000
high = 64000
chars_per_token = 3

[watchdog]
heartbeat_seconds = 120     # the executor PATCHes its progress comment at least this often
silent_kill_seconds = 900   # a run with no heartbeat for this long is killed
max_denials = 15            # give up after this many retries of a refused command
max_calls_low_variety = 25  # a run repeating near-identical helper scripts is cut here
poll_seconds = 15
# a fresh VM must hold an address (guest agent) within this; one that does not
# is reaped and cloned once more
net_wait_seconds = 180

[shift]
# the run cap of one shift, so one long round cannot hold the lane forever
max_runs = 60
concurrency = 1             # the local lane is serial by hardware
vm_template = 9001          # dark-agent-go: git, build-essential, go, python3
vmid_base = 9500            # executor VMs 9500+slot, staging VMs 9550+slot
