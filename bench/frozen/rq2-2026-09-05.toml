# Frozen envelope for the RQ2 comparison set, 2026-09-05.
#
# An envelope is the limit one run is cut off at: model calls, wall seconds,
# characters of visible thinking. The runner normally computes it from the
# ledger's own recent passes, so it moves while a set of rounds runs: on
# 2026-09-04 one tier's first round was cut off at 900 seconds and its third
# at 450, and the difference arrived as three budget failures that read as
# the model getting worse (reports/950-overnight-report.md, defect 8).
#
# These numbers are the hard caps a human wrote in the runner's budgets.toml,
# which is the basis the first round of every 2026-09-04 lane ran on. They are
# copied here rather than referenced so that this file, and its hash, is the
# whole statement of the limit. Both arms of RQ2 read it.
#
# runs = 1 everywhere: one tier takes the task once. Escalation asks the
# envelope whether a second run is allowed, and for a comparison set it is not.
#
# Every run.start of a shift launched with --frozen carries this file's name
# and the SHA-256 of its bytes, so a table can name the rounds that shared a
# limit and a reader can check that they did.

set = "rq2-2026-09-05"
note = "RQ2: pipeline against a plain pi session, deepseek-v4-flash, five rounds per arm"

[class.additive]
calls = 6
seconds = 900
max_reasoning_chars = 40000
think = "low"
runs = 1

[class.mechanical]
calls = 4
seconds = 300
max_reasoning_chars = 10000
think = "none"
runs = 1

[class.repair]
calls = 8
seconds = 900
max_reasoning_chars = 40000
think = "low"
runs = 1
