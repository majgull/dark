# Frozen envelope for the second RQ2 comparison set, 2026-09-05.
#
# The first set (rq2-2026-09-05) gave both arms six model calls on an additive
# task. That is one whole solution for the pipeline, whose protocol asks for
# the complete content of every changed file in a single reply, and about five
# keystrokes for a session, which spends one call per tool round-trip. Four of
# the session arm's five failures in round 1 were the call envelope, while the
# wall limit bound neither arm: every run finished inside 200 seconds against
# a cap of 900.
#
# This set raises the call cap until it stops binding either arm, and holds
# everything else identical, so the pair answers one question: does the
# pipeline still lead when calls are not the constraint?
#
# The numbers: four times the first set's caps, which is above the largest
# call count either arm has recorded on these tasks (7). The seconds are
# unchanged, and at the ten seconds per call these runs average they still
# leave room for the full call budget.

set = "rq2b-2026-09-05"
note = "RQ2 second set: the same two arms with a call cap that binds neither"

[class.additive]
calls = 24
seconds = 900
max_reasoning_chars = 40000
think = "low"
runs = 1

[class.mechanical]
calls = 16
seconds = 300
max_reasoning_chars = 10000
think = "none"
runs = 1

[class.repair]
calls = 24
seconds = 900
max_reasoning_chars = 40000
think = "low"
runs = 1
