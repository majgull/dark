name: ci

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the whole history, not only the tip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: install
        # a job-local virtual environment: runners that share one tool cache
        # between concurrent jobs must not install into the same Python
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install ".[dev]"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: gitleaks
        # the pinned release, checked against its published sha256; verify.sh
        # fails without it rather than skipping the credential scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: runner gate
        run: cd runner && bash verify.sh
      - name: example tasks
        run: python3 bench/tools/check_tasks.py
      - name: task set
        # Clone the task set from the server that runs this workflow, with the
        # job token, and check out the commit bench/dark-tasks.ref names. The
        # repository variable DARK_TASKS_URL overrides the clone URL; that is
        # how a local act run points the clone at a local copy of the task set.
        run: |
          url="${{ vars.DARK_TASKS_URL }}"
          url="${url:-${{ github.server_url }}/${{ github.repository_owner }}/dark-tasks}"
          case "$url" in
            http://*|https://*) url="${url%%://*}://x-access-token:${{ github.token }}@${url#*://}" ;;
          esac
          git clone "$url" dark-tasks
          git -C dark-tasks checkout "$(cat bench/dark-tasks.ref)"
      - name: task records
        run: python3 bench/tools/check_tasks.py dark-tasks
      - name: task acceptance
        run: DARK_TASKS=dark-tasks python3 bench/tools/validate.py
