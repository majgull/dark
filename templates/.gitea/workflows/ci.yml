name: templates-ci
# Both starting trees must be green on their own: a template whose verify.sh
# is red would make every task repo red before any work.
on:
  push:
    branches: ['**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no binaries, nothing over 1MB
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            [ -f "$f" ] && [ -s "$f" ] || continue
            LC_ALL=C grep -Iq . -- "$f" || { echo "binary file tracked: $f"; exit 1; }
            [ "$(stat -c %s -- "$f")" -le 1048576 ] || { echo "file over 1MB: $f"; exit 1; }
          done < <(git ls-files -z)
      - name: ensure go
        run: |
          if ! command -v go >/dev/null; then
            v=$(curl -fsSL https://go.dev/VERSION?m=text | head -1)
            curl -fsSL "https://go.dev/dl/${v}.linux-amd64.tar.gz" | tar -C /usr/local -xz
          fi
          echo /usr/local/go/bin >> "$GITHUB_PATH"
      - name: go template verifies
        run: bash go/.dark/verify.sh
      - name: python template verifies
        run: bash python/.dark/verify.sh
